# /etc/nginx/conf.d/exe-soc.conf  - TEMPLATE. Validate with: nginx -t
limit_req_zone $binary_remote_addr zone=soc_login:10m rate=10r/m;
server_tokens off;
# Redirect to the CONFIGURED name, never to the client-supplied Host (a forged Host header would otherwise be reflected into the Location header). Unknown Host names get no response.
server { listen 80 default_server; server_name _; return 444; }
server { listen 80; server_name soc.example.com; return 301 https://soc.example.com$request_uri; }
server { listen 443 ssl default_server; server_name _; ssl_reject_handshake on; }
server {
  listen 443 ssl http2; server_name soc.example.com;
  ssl_certificate /etc/ssl/exe-soc/fullchain.pem; ssl_certificate_key /etc/ssl/exe-soc/privkey.pem; ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m; ssl_session_timeout 1h; ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000" always;        # enable only after HTTPS is confirmed working end to end
  client_max_body_size 16m;
  # the application trusts X-Forwarded-* ONLY from SOC_TRUSTED_PROXIES (127.0.0.1); nginx REPLACES (never appends to) client-supplied values:
  proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-Host $host;
  location = /login { limit_req zone=soc_login burst=5 nodelay; proxy_pass http://127.0.0.1:5000; proxy_http_version 1.1; }
  location /socket.io/ { proxy_pass http://127.0.0.1:5000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_buffering off; proxy_read_timeout 300s; }
  location / { proxy_pass http://127.0.0.1:5000; proxy_http_version 1.1; proxy_read_timeout 120s; }
}
